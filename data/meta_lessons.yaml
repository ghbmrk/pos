  - id: control_immunity
    title: Immunity to stun, freeze and ailments
    side: defence
    principle: Make the build unable to lose control (stunned, frozen, heavily slowed) before stacking more health;
      deaths in the hardest fights often start with one lost second, not one big hit.
    compounds: Keeps every other layer and the damage uptime working; without it a single stun or freeze turns a
      survivable fight into a chain of hits taken without recovery.
    limits: The PoB numbers barely see it (no metric for time spent stunned), so ablation reads it as zero damage and
      little EHP; judge it on the boss mechanics, not on the score.
    eras:
      - { game: poe1, era: "every league", evidence: recall, examples: ["freeze immunity flasks", "Unwavering Stance", "Brine King pantheon", "ailment immunity"] }
      - { game: poe2, era: "0.1 onward", evidence: recall, examples: [] }
    poe2:
      anchors:
        - { kind: keystone, name: Unwavering Stance }
        - { kind: notable, name: Crystallised Immunities }
        - { kind: notable, name: Against the Elements }
        - { kind: unique, name: Dream Fragments }
      search:
        - { kind: notable, text: Ailment Threshold }
        - { kind: notable, text: Stun Threshold }
    levers: [life]
    pob: not_modelled

  - id: burst_recovery
    title: Recovery that answers burst
    side: defence
    principle: Pair the defence layers with recovery that refills fast after a big hit (flasks, recoup, instant or
      recharging pools), so the build survives sequences of hits, not just the single largest one.
    compounds: Effective HP over a fight = pool x mitigation, refilled at the recovery rate; recovery multiplies how
      often the pool can be spent.
    limits: Steady-state recovery does not save a one-shot; check the largest named hit first (benchmark margins), then
      recovery.
    eras:
      - { game: poe1, era: "every league", evidence: recall, examples: ["instant life flasks", "Petrified Blood", "Aegis Aurora", "recoup clusters"] }
      - { game: poe2, era: "0.1 onward", evidence: recall, examples: [] }
    poe2:
      anchors:
        - { kind: keystone, name: Oasis }
        - { kind: notable, name: Heavy Drinker }
        - { kind: notable, name: Made to Last }
        - { kind: notable, name: Endured Suffering }
        - { kind: keystone, name: Eternal Youth }
      search:
        - { kind: notable, text: Recouped }
    levers: [life, energy_shield]
    pob: partial

