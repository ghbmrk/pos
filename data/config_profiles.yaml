# Fixed PoB configuration profiles (docs/spec.md). A spec names exactly one; its canonical hash is part of the
# result-cache key, so DPS figures are only ever compared under the same enemy/conditions.
# `options` are applied with PobEngine.set_config(options=...); `custom_mods` as custom_mods=.
# Only option keys exercised in pos_engine/tests are used here (enemyIsBoss: Boss | Pinnacle). Add keys after
# checking them with PobEngine.list_config_options on the pinned PoB.
schema_version: 1
profiles:
  none:
    # PoB's enemyIsBoss default index is 3 = Pinnacle, so with no option PoB evaluates against a Pinnacle boss (verified
    # 2026-11-22: identical outputs to enemyIsBoss: Pinnacle). The old description ("50% resists") was a symptom of that.
    description: Normal (non-boss) enemy, no resistances (enemyIsBoss None).
    options: { enemyIsBoss: None }
  pob_default:
    description: No option set; PoB then defaults to a Pinnacle boss (same results as pinnacle_boss).
    options: {}
  boss:
    description: Standard boss enemy.
    options: { enemyIsBoss: Boss }
  pinnacle_boss:
    description: Pinnacle boss enemy (higher resistances; the default for DPS comparisons).
    options: { enemyIsBoss: Pinnacle }

# Declared conditions (I11). A spec may list `conditions: [name, ...]`; assembly applies these PoB options on top of the
# profile, so conditional notables/keystones/supports are measured instead of reading as zero. Only steady-state
# conditions the build can plausibly sustain belong here; the slate must justify each one in a claim (the report lists
# them next to every figure). Option keys checked with PobEngine.list_config_options at the pinned PoB.
# `needs` = what the build itself must provide for the assumption to be fair (reviewed by Opus, not enforced).
conditions:
  power_charges:     { options: { usePowerCharges: true },     needs: "a way to gain Power Charges", description: "Power Charges at maximum" }
  frenzy_charges:    { options: { useFrenzyCharges: true },    needs: "a way to gain Frenzy Charges", description: "Frenzy Charges at maximum" }
  endurance_charges: { options: { useEnduranceCharges: true }, needs: "a way to gain Endurance Charges", description: "Endurance Charges at maximum" }
  enemy_shocked:     { options: { conditionEnemyShocked: true },  needs: "lightning hits or a shock source", description: "Enemy is Shocked" }
  enemy_chilled:     { options: { conditionEnemyChilled: true },  needs: "cold hits or a chill source", description: "Enemy is Chilled" }
  enemy_ignited:     { options: { conditionEnemyIgnited: true },  needs: "fire hits or an ignite source", description: "Enemy is Ignited" }
  enemy_bleeding:    { options: { conditionEnemyBleeding: true }, needs: "physical hits or a bleed source", description: "Enemy is Bleeding" }
  enemy_poisoned:    { options: { conditionEnemyPoisoned: true }, needs: "chaos/physical hits or a poison source", description: "Enemy is Poisoned" }
  ground_shocked:    { options: { conditionEnemyOnShockedGround: true }, needs: "a shocked-ground source", description: "Enemy stands on Shocked Ground" }
  ground_chilled:    { options: { conditionEnemyOnChilledGround: true }, needs: "a chilled-ground source", description: "Enemy stands on Chilled Ground" }
  ground_scorched:   { options: { conditionEnemyOnScorchedGround: true }, needs: "a scorched-ground source", description: "Enemy stands on Scorched Ground" }
  ground_brittle:    { options: { conditionEnemyOnBrittleGround: true }, needs: "a brittle-ground source", description: "Enemy stands on Brittle Ground" }
  ground_sapped:     { options: { conditionEnemyOnSappedGround: true }, needs: "a sapped-ground source", description: "Enemy stands on Sapped Ground" }
  corpses_nearby:    { options: { multiplierNearbyCorpse: 5 }, needs: "kills or corpse generation in the fight (not true on a lone boss)", description: "5 nearby corpses" }
  onslaught:         { options: { buffOnslaught: true }, needs: "an Onslaught source", description: "Onslaught active" }
  hit_recently:      { options: { conditionHitRecently: true }, needs: "none for attacks and spells that hit continuously", description: "Hit recently" }
  crit_recently:     { options: { conditionCritRecently: true }, needs: "a crit chance high enough to crit every few seconds", description: "Crit recently" }
  killed_recently:   { options: { conditionKilledRecently: true }, needs: "trash in the fight (not true on a lone boss)", description: "Killed recently" }
