# Effects a second actor can apply to the player's calc (docs/second-actor.md). Each maps to PoB config options.
# Every option key must exist on the pinned PoB (tested via list_config_options in test_actors.py).
# `{count}` in an option value is filled from the effect's params; params lists the ones an effect needs.
schema_version: 1
effects:
  power_charges:     { options: { usePowerCharges: true, overridePowerCharges: "{count}" }, params: [count] }
  frenzy_charges:    { options: { useFrenzyCharges: true, overrideFrenzyCharges: "{count}" }, params: [count] }
  endurance_charges: { options: { useEnduranceCharges: true, overrideEnduranceCharges: "{count}" }, params: [count] }
  enemy_on_shocked_ground:     { options: { conditionEnemyOnShockedGround: true } }
  enemy_on_chilled_ground:     { options: { conditionEnemyOnChilledGround: true } }
  enemy_on_scorched_ground:    { options: { conditionEnemyOnScorchedGround: true } }
  enemy_on_brittle_ground:     { options: { conditionEnemyOnBrittleGround: true } }
  enemy_on_sapped_ground:      { options: { conditionEnemyOnSappedGround: true } }
  enemy_on_consecrated_ground: { options: { conditionEnemyOnConsecratedGround: true } }
  enemy_on_profane_ground:     { options: { conditionEnemyOnProfaneGround: true } }
  enemy_on_fungal_ground:      { options: { conditionEnemyOnFungalGround: true } }
  player_on_consecrated_ground: { options: { conditionOnConsecratedGround: true } }
  banner_planted:      { options: { bannerPlanted: true } }
  companion_in_presence: { options: { companionInPresence: true } }
  nearby_allies:       { options: { multiplierNearbyAlly: "{count}" }, params: [count] }
  # K5 (assumed Squire scenarios): keys read from ConfigOptions.lua at the pinned PoB; probed in test_actors.py
  enemy_shocked:       { options: { conditionEnemyShocked: true } }
  enemy_intimidated:   { options: { conditionEnemyIntimidated: true } }
  enemy_armour_broken: { options: { conditionEnemyArmourBroken: true } }
  whirlwind_cold:      { options: { whirlwindBuffCold: true } }
  whirlwind_fire:      { options: { whirlwindBuffFire: true } }
  whirlwind_lightning: { options: { whirlwindBuffLightning: true } }
  # Squire value channels (owner "go" 2026-11-23, cmsg_01RxGYnd78N9kMbbAJ5pWDhUN7wzu4E7SYKFBWbaaEgsw3; docs/squire-channels.md).
  # Enemy resistance: an explicit value replaces the boss tier's standard resistance (pob_headless set_config); off = the tier again.
  enemy_lightning_res: { options: { enemyLightningResist: "{value}" }, params: [value] }
  enemy_cold_res:      { options: { enemyColdResist: "{value}" }, params: [value] }
  enemy_fire_res:      { options: { enemyFireResist: "{value}" }, params: [value] }
  enemy_heavy_stunned: { options: { conditionEnemyHeavyStunned: true } }
  # customMods = raw mod lines on the player's calc (PoB parses them like item text); lines from several effects add up.
  ally_increased_damage: { options: { customMods: "{pct}% increased Damage" }, params: [pct] }
  companion_takes_hit_damage:
    options: { customMods: "{pct}% of Damage from Hits is taken from your Damageable Companion's Life before you", TotalCompanionLife: "{life}" }
    params: [pct, life]
