candidates:
  - name: "Aggravated bleed lance"
    archetype: { defence: evasion, engine: "Crimson Assault aggravates bleed, Blood Hunt then consumes it in a blood explosion" }
    spec:
      pob_sha: "601768b"
      class: Huntress
      ascendancy: Amazon
      level: 90
      main_skill: { gem: Blood Hunt }
      tiers: [mid]
      conditions: [enemy_bleeding]
      fixed: { keystones: [Crimson Assault], notables: [], uniques: [], supports: [Incision] }
    key_pieces: [ { kind: keystone, id: Crimson Assault }, { kind: support, id: Incision } ]
    claims:
      - text: "Crimson Assault makes the bleed stronger and aggravated, which feeds the consume on Blood Hunt."
        cites:
          - { kind: keystone, id: Crimson Assault, quote: "50% more Magnitude of Bleeding you inflict" }
          - { kind: skill, id: Blood Hunt, quote: "Hitting an enemy that has suffered Blood Loss will cause a blood explosion and also Consume Bleeding." }
      - text: "Incision raises the bleed chance on every hit, so enemies are bleeding for the payoff; the bleeding condition is declared and comes from Incision plus the keystone."
        cites:
          - { kind: support, id: Incision, quote: "which causes Enemies to be increasingly more likely to be inflicted with Bleeding" }
    bases: { weapon: Akoyan Spear, body_armour: Hunting Coat }
    source: llm

  - name: "Stacked poison archer"
    archetype: { defence: evasion, engine: "Pathfinder lets many poisons stack on one target, Escalating Poison adds yet another poison per hit" }
    spec:
      pob_sha: "601768b"
      class: Ranger
      ascendancy: Pathfinder
      level: 90
      main_skill: { gem: Poisonburst Arrow }
      tiers: [mid]
      conditions: [enemy_poisoned]
      fixed: { keystones: [], notables: [Overwhelming Toxicity], uniques: [], supports: [Escalating Poison] }
    key_pieces: [ { kind: notable, id: Overwhelming Toxicity }, { kind: support, id: Escalating Poison } ]
    claims:
      - text: "Pathfinder raises how many poisons a target can carry, at the cost of shorter poisons."
        cites:
          - { kind: notable, id: Overwhelming Toxicity, quote: "Double the number of your Poisons that targets can be affected by at the same time" }
      - text: "Escalating Poison adds an extra poison on each hit, filling those extra slots; the poisoned condition is sustained by the skill's own poison burst."
        cites:
          - { kind: support, id: Escalating Poison, quote: "allowing it to inflict an extra Poison on enemies but shortening the duration of those Poisons" }
          - { kind: skill, id: Poisonburst Arrow, quote: "Fire a virulent arrow that creates a burst of Poison on hit, affecting all enemies in an area." }
    bases: { weapon: Crude Bow, body_armour: Hunting Coat }
    source: llm

  - name: "Fire-only gas bomber"
    archetype: { defence: energy_shield, engine: "Avatar of Fire turns the whole hit into fire so ignite carries the damage, and the gas cloud detonates off ignited enemies" }
    spec:
      pob_sha: "601768b"
      class: Ranger
      ascendancy: Deadeye
      level: 90
      main_skill: { gem: Gas Arrow }
      tiers: [mid]
      conditions: [enemy_ignited]
      fixed: { keystones: [Avatar of Fire], notables: [], uniques: [], supports: [] }
    key_pieces: [ { kind: keystone, id: Avatar of Fire } ]
    claims:
      - text: "Avatar of Fire converts damage to fire so the fire-heavy arrow and its ignites scale together; the sweep showed it as the top lead for this skill."
        cites:
          - { kind: keystone, id: Avatar of Fire, quote: "75% of Damage Converted to Fire Damage" }
      - text: "The gas cloud explodes when an ignited enemy touches it, so the ignited condition is declared and sustained by the arrow's own fire."
        cites:
          - { kind: skill, id: Gas Arrow, quote: "The cloud will detonate if hit by a Detonator skill or if an Ignited enemy touches it, creating a fiery explosion." }
    bases: { weapon: Crude Bow, body_armour: Ascetic Garb }
    source: "sweep:probe1/Avatar of Fire"

  - name: "Freeze then shatter monk"
    archetype: { defence: evasion, engine: "Invoker freezes into chilled ground, Biting Frost consumes the freeze for more damage and leaves the enemy chilled" }
