      ascendancy: Warbringer
      level: 90
      main_skill: { gem: Boneshatter }
      tiers: [mid]
      conditions: [enemy_bleeding]
      fixed: { keystones: [], notables: ["Anvil's Weight"], uniques: [], supports: [Rupture] }
    key_pieces: [ { kind: support, id: Rupture }, { kind: notable, id: "Anvil's Weight" } ]
    claims:
      - text: "Rupture aggravates bleeding whenever the strike lands on a heavily stunned enemy, which is exactly what Boneshatter causes."
        cites:
          - { kind: support, id: Rupture, quote: "Supported skills Aggravate Bleeding on Hitting Heavily Stunned Enemies." }
          - { kind: skill, id: Boneshatter, quote: "The Strike will cause a Heavy Stun on enemies that are Primed for Stun." }
