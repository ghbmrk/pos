    claims:
      - text: "Freezing enemies leaves chilled ground behind, which is where the ground condition comes from."
        cites:
          - { kind: notable, id: "I am the Blizzard...", quote: "On Freezing Enemies create Chilled Ground" }
      - text: "Biting Frost turns frozen enemies into extra damage and leaves them chilled afterwards."
        cites:
          - { kind: support, id: Biting Frost II, quote: "causing them to deal more damage to Frozen enemies but consume their Freeze, leaving them Chilled" }
